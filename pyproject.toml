[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex-mcp-server"
version = "2.0.2"
description = "Durable per-task working memory for coding agents, over MCP."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "sfaustodev" }]
keywords = ["mcp", "memory", "agent", "context", "llm"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sfaustodev/cortex"
Repository = "https://github.com/sfaustodev/cortex"
Issues = "https://github.com/sfaustodev/cortex/issues"

[project.scripts]
cortex-mcp-server = "cortex_server:main"

# Os dois módulos são de topo e o server importa o store pelo nome: o wheel
# tem que levar ambos, senão o console script morre no import.
[tool.hatch.build.targets.wheel]
include = ["cortex_server.py", "cortex_store.py"]

[tool.hatch.build.targets.wheel.sources]
"cortex_server.py" = "cortex_server.py"
"cortex_store.py" = "cortex_store.py"

[tool.hatch.build.targets.sdist]
include = [
  "cortex_server.py",
  "cortex_store.py",
  "tests/",
  "docs/",
  "README.md",
  "LICENSE",
]
